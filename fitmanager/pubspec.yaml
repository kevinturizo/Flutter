name: fitmanager
description: "Taurus GYM - Aplicación para clientes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  http_parser: ^4.0.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/fitmanager_logo.png
    - assets/images/taurus_logo.png
