workflows:
  ios-build:
    name: iOS Build
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build IPA
        script: flutter build ipa --release --no-codesign
      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r FitManager.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa